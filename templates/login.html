{% extends 'base.html' %}
{% block title %}Login – WanderWorld{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-body p-4">
          <h3 class="fw-bold text-center mb-4"><i class="bi bi-box-arrow-in-right text-warning"></i> Login</h3>
          <form method="POST">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" required autofocus />
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" name="password" class="form-control" required />
            </div>
            <button type="submit" class="btn btn-dark w-100">Login</button>
          </form>
          <hr />
          <p class="text-center mb-0">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
