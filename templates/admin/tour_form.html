{% extends 'base.html' %}
{% block title %}{{ 'Edit' if tour else 'Add' }} Tour – Admin{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card shadow">
        <div class="card-body p-4">
          <h3 class="fw-bold mb-4">
            <i class="bi bi-{{ 'pencil' if tour else 'plus-circle' }} text-warning"></i>
            {{ 'Edit Tour' if tour else 'Add New Tour' }}
          </h3>
          <form method="POST">
            <div class="mb-3">
              <label class="form-label">Title</label>
              <input type="text" name="title" class="form-control" value="{{ tour.title if tour else '' }}" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Destination</label>
              <input type="text" name="destination" class="form-control" value="{{ tour.destination if tour else '' }}" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea name="description" class="form-control" rows="4" required>{{ tour.description if tour else '' }}</textarea>
            </div>
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Duration (days)</label>
                <input type="number" name="duration_days" class="form-control" value="{{ tour.duration_days if tour else '' }}" min="1" required />
              </div>
              <div class="col-md-4">
                <label class="form-label">Price ($)</label>
                <input type="number" name="price" class="form-control" value="{{ tour.price if tour else '' }}" min="0" step="0.01" required />
              </div>
              <div class="col-md-4">
                <label class="form-label">Max Seats</label>
                <input type="number" name="max_seats" class="form-control" value="{{ tour.max_seats if tour else '' }}" min="1" required />
              </div>
            </div>
            <div class="mb-3 mt-3">
              <label class="form-label">Image URL</label>
              <input type="url" name="image_url" class="form-control" value="{{ tour.image_url if tour else '' }}" placeholder="https://..." />
            </div>
            {% if tour %}
            <div class="mb-3 form-check">
              <input type="checkbox" name="is_active" class="form-check-input" id="isActive" {{ 'checked' if tour.is_active }}>
              <label class="form-check-label" for="isActive">Active (visible to users)</label>
            </div>
            {% endif %}
            <button type="submit" class="btn btn-warning w-100 fw-bold">
              {{ 'Update Tour' if tour else 'Add Tour' }}
            </button>
            <a href="{{ url_for('admin_tours') }}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
