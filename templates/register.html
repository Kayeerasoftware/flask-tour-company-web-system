{% extends 'base.html' %}
{% block title %}Register – DEHAPIZ Tour and Travel{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow border-0">
        <div class="card-header bg-dark text-center py-4">
          <img src="{{ url_for('static', filename='dehapiz_logo.jpeg') }}" alt="DEHAPIZ" height="55" class="rounded mb-2" />
          <h4 class="text-white fw-bold mb-0">Create Account</h4>
          <p class="text-muted small mb-0">Join DEHAPIZ and start exploring Uganda</p>
        </div>
        <div class="card-body p-4">
          <form method="POST">
            <div class="mb-3">
              <label class="form-label fw-semibold">Full Name</label>
              <input type="text" name="name" class="form-control form-control-lg" placeholder="e.g. Nakato Sarah" required autofocus />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Email Address</label>
              <input type="email" name="email" class="form-control form-control-lg" placeholder="you@example.com" required />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Password</label>
              <input type="password" name="password" class="form-control form-control-lg" placeholder="Min. 6 characters" required minlength="6" />
            </div>
            <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold">Create Account</button>
          </form>
          <hr />
          <p class="text-center mb-0 small">Already have an account? <a href="{{ url_for('login') }}" class="text-warning fw-bold">Login here</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
