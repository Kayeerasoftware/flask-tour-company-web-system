{% extends 'base.html' %}
{% block title %}Register – WanderWorld{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-body p-4">
          <h3 class="fw-bold text-center mb-4"><i class="bi bi-person-plus text-warning"></i> Create Account</h3>
          <form method="POST">
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" name="name" class="form-control" required autofocus />
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" name="password" class="form-control" required minlength="6" />
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold">Register</button>
          </form>
          <hr />
          <p class="text-center mb-0">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
